<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Background circle -->
  <circle cx="64" cy="64" r="60" fill="#4285f4"/>

  <!-- Globe-like sphere -->
  <circle cx="64" cy="64" r="52" fill="#ffffff"/>

  <!-- Translation lines -->
  <g fill="#4285f4">
    <!-- Left side: foreign text bars -->
    <rect x="26" y="44" width="20" height="6" rx="3"/>
    <rect x="26" y="56" width="14" height="6" rx="3"/>
    <rect x="26" y="68" width="18" height="6" rx="3"/>
    <rect x="26" y="80" width="12" height="6" rx="3"/>

    <!-- Arrow in middle -->
    <path d="M54 64 L78 64" stroke="#34a853" stroke-width="5" stroke-linecap="round"/>

    <!-- Right side: translated text bars -->
    <rect x="82" y="44" width="20" height="6" rx="3" fill="#ea4335"/>
    <rect x="88" y="56" width="14" height="6" rx="3" fill="#ea4335"/>
    <rect x="82" y="68" width="18" height="6" rx="3" fill="#ea4335"/>
    <rect x="90" y="80" width="12" height="6" rx="3" fill="#ea4335"/>
  </g>
</svg>