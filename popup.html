<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { width: 280px; padding: 16px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    h3 { font-size: 16px; font-weight: 600; color: #202124; margin-bottom: 12px; }
    select { width: 100%; padding: 10px 12px; margin-bottom: 12px; border: 1px solid #dadce0; border-radius: 6px; font-size: 14px; background: #fff; cursor: pointer; }
    select:hover { border-color: #1a73e8; }
    button { width: 100%; padding: 10px; background: #1a73e8; color: white; border: none; border-radius: 6px; font-size: 14px; font-weight: 500; cursor: pointer; transition: background 0.2s; }
    button:hover { background: #1557b0; }
    .footer { margin-top: 12px; font-size: 11px; color: #5f6368; text-align: center; }
  </style>
</head>
<body>
  <h3 data-i18n="popup_title">Translate Site</h3>
  <select id="lang">
    <option value="zh-CN">Chinese (Simplified)</option>
    <option value="zh-TW">Chinese (Traditional)</option>
    <option value="en" selected>English</option>
    <option value="ja">Japanese</option>
    <option value="ko">Korean</option>
    <option value="es">Spanish</option>
    <option value="fr">French</option>
    <option value="de">German</option>
    <option value="pt-BR">Portuguese (Brazil)</option>
    <option value="ru">Russian</option>
    <option value="it">Italian</option>
    <option value="nl">Dutch</option>
    <option value="ar">Arabic</option>
  </select>
  <button id="translate" data-i18n="translate_button">Translate</button>
  <p class="footer">Powered by Google Translate</p>
  <script src="popup.js"></script>
</body>
</html>
